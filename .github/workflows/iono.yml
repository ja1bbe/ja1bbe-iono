name: 国分寺の電離層データを取得

on:
  schedule:
    - cron: '22 * * * *'   # 1時間ごと（UTC）。公開ファイルの更新頻度に合わせて間隔を調整する
  workflow_dispatch:               # 手動でも実行できるようにする

permissions:
  contents: write

concurrency:
  group: iono
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NICTから取得してiono.jsonを更新
        run: python fetch_iono.py
      - name: 変更があればコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/iono.json
          git diff --cached --quiet || (git commit -m "iono: $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
